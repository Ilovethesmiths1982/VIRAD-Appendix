name: virad26

channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  - numpy<2
  - scipy
  - pandas
  - scikit-learn
  - cd-hit=4.8.1
  - mafft=7.520
  - phast
  - meme=5.5.5
  - infernal=1.1.5
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - pip
  - pip:
      - biopython==1.81
      - fair-esm
      - torch-geometric==2.3.1
      - tensorboard
      - captum
      - umap-learn
      - plotly
      - pytest
      # UFold production inference is validated in a dedicated environment.
      # Legacy SPOT-RNA compatibility, when required, also uses a separate environment.
